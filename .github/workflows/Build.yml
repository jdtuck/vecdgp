name: Build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # bash on every OS: PowerShell only propagates the exit code of the last
      # command, so a failing `pip install -e .` used to leave the step green.
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e . --verbose
        pip install pytest pytest-cov
    - name: Test with pytest
      shell: bash
      run: |
        pytest --doctest-modules --junitxml=junit/test-results.xml --cov=vecdgp --cov-report=xml --cov-report=html

    - name: Environment and numerical self-check
      # Logs the BLAS/LAPACK build, numba threading layer and thread count for
      # this OS/Python, then re-runs the exactness identities and fails on any
      # numerical warning. Worth having per-platform: numerical behaviour here
      # depends on the LAPACK underneath numpy (MKL and OpenBLAS disagree on
      # near-underflowing matrices), and speed depends on the thread count
      # numba actually gets. Cheap, and turns "works on my machine" into
      # something readable in the log.
      shell: bash
      run: python -m vecdgp.diagnose

    - name: Test under numba's workqueue threading layer
      # One job is enough -- the point is to exercise the *layer*, not the OS.
      #
      # workqueue is numba's fallback and is NOT threadsafe: entering a
      # parallel=True kernel from several Python threads aborts the
      # interpreter outright ("Concurrent access has been detected"). omp and
      # tbb tolerate it. A stock macOS install typically lands on workqueue,
      # which is how v0.3.0 passed on Linux (omp) and hard-crashed on macOS.
      #
      # Forcing the layer on a Linux runner catches that class of bug on every
      # push, without waiting for a macOS job to fall over.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      shell: bash
      env:
        NUMBA_THREADING_LAYER: workqueue
      run: pytest -q
  
  build_sdist:
    needs: [build]
    if: startsWith( github.ref, 'refs/tags/')
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
  
  release:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into release/
          # if `name: artifact` is omitted, the action will create extra parent dir
          pattern: vecdgp-*
          path: ./release/
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release/*
  
  upload_pypi:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks default artifact into dist/
          # if `name: artifact` is omitted, the action will create extra parent dir
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

