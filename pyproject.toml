[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vecdgp"
version = "0.1.1"
description = "Vecchia-approximated deep Gaussian processes (Sauer, Cooper & Gramacy 2023) in Python"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
fast = ["numba>=0.57"]
examples = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vecdgp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
